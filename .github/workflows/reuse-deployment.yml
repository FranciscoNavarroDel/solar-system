name: Deployment - Reusable WorkFlow

on:
  workflow_call:
  secrets:
    k8s-kubeconfig:
      required: true
    mongodb-password:
      required: true
  inputs:
    mongodb-uri:
      required: true
      type: string
    kubectl-version:
      description: Provide the required Kubectl version
      default: v1.27.0
      required: false
      type: string
    k8s-manifiest-dir:
      description: Directory containing kubernetes manifests files
      default: Kubernetes/
      required: true
      type: string
    environment:
      description: Provide the deployment environment
      default: dev
      required: true
      type: string
  outputs:
    application-url:
      value: ${{jobs.reuse-deploy.outputs.APP_INGRESS_URL}}
jobs:
    reuse-deploy:
      environment:
        name: ${{ inputs.environment }}
        url:  https://${{ steps.set-ingress.host-address.outputs.APP_INGRESS_HOST}} 
      outputs:
        APP_INGRESS_URL: ${{ steps.set-ingress.host-address.outputs.APP_INGRESS_HOST}} 
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Repository
          uses: actions/checkout@v7

        - name: Install kubectl CLI
          uses: azure/setup-kubectl@v4
          with:
              version: '${{ inputs.kubectl-version }}'

        - name: Set Kubeconfig
          uses: azure/k8s-set-context@v5
          with:
            method: kubeconfig
            kubeconfig: ${{ secrets.k8s-kubeconfig }}

        - name: Fetch Kubernets Cluster Details
          run: | 
            kubectl version --short
            echo -----------------------------
            kubectl get nodes

        - name: Save Nginx Ingress Controller IP as a Github Environment variable
          run: |
            echo "INGRESS_IP=$(kubectl -n ingress-nginx get services ingress-nginx-controller -o jsonpath="{.status.loadBalancer.ingress[0].ip}")" >> $GITHUB_ENV
        
        - name: Replace Token in Manifest files
          uses: cschleiden/replace-tokens@v1
          with:
            tokenPrefix: '${'
            tokenSuffix: '}'
            files: '["${{inputs.k8s-manifiest-dir}}*.yaml"]'
          env:
            NAMESPACE: ${{ vars.NAMESPACE }}
            REPLICAS: ${{ vars.REPLICAS }}
            IMAGE: ${{ env.DOCKERHUB_PASSWORD }}/solar-system:${{ github.sha }}
            INGRESS_IP: ${{env.INGRESS_IP}}
        
        - name: Create MongoDB secretRef
          run: |
            kubectl -n ${{ vars.NAMESPACE }} create secret generic mongo-db-creds \
            --from-literal=MONGO_URI=${{ inputs.mongodb-uri }} \
            --from-literal=MONGO_USERNAME=${{ env.MONGO_USERNAME }} \
            --from-literal=MONGO_PASSWORD=${{ secrets.mongodb-password }} \
            --save-config \
            --dry-run=client \
            -o yaml | kubectl apply -f -

        - name: Deploy to Prod Environment
          run: |
            kubectl apply -f ${{inputs.k8s-manifiest-dir}}

        - name: Set App Ingress Host URL
          id: set-ingress.host-address
          run: |
            echo "APP_INGRESS_HOST"=$(kubectl -n ${{ vars.namespace }} get ingress -o jsonpath=" {.items[0].spec.tls[0].hosts[0]"}")