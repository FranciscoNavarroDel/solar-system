name: Solar System WorkFlow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

env: 
    MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData' # esto es un placeHolder para el ejemplo
    MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
    MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
  unit-testing:
    name: Unit Testing
    strategy: 
      matrix: 
        nodejs_version: [18, 19, 20]
        operating_system: [ubuntu-latest, macos-latest]
        exclude:
          - nodejs_version: 18
            operating_system: macos-latest
    runs-on: ${{ matrix.operating_system }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Setup NodeJS Version - ${{ matrix.nodejs_version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.nodejs_version }}

    - name: Cache NPM dependencies
      uses: actions/cache@v6
      with:
        path: node_modules
        key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json')}}

    - name: Install Dependencies
      run: npm install

    - name: Unit Testing
      id: nodejs-unit-testing-step
      run: npm test

    - name: Archive Test Result
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: Mocha-Test-Result
        path: test-results.xml

  code-coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup NodeJS Version - 18
        uses: actions/setup-node@v7
        with:
          node-version: 18

      - name: Cache NPM dependencies
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json')}

      - name: Install Dependencies
        run: npm install

      - name: Check Code Coverage
        run: npm run coverage

      - name: Archive Test 
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: Code-Coverage-Result
          path: coverage
          retention_days: 5

  docker:
        name: Containerization
        needs: [unit-testing, code-coverage]
        permissions: 
            packages: write
        runs-on: ubuntu-latest
        steps:
          - name: Login to Docker Hub
            uses: docker/login-action@v4
            with:
              username: ${{ vars.DOCKERHUB_USERNAME }}
              password: ${{ secrets.DOCKERHUB_PASSWORD }}

          - name: Login to GitHub Container Registry
            uses: docker/login-action@v4
            with:
              registry: ghcr.io
              username: ${{ github.repository_owner }}
              password: ${{ secrets.GITHUB_TOKEN }}

          - name: Docker Build for testing
            uses: docker/build-push-action@v7
            with:
              context: .
              push: false
              tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{github.sha}}     
          
          - name: Docker Image Testing
            run: |
              docker images
              docker run --name solar-system-app -d \
                  -p 3000:3000 \
                  -e  MONGO_URI= $MONGO_URI \
                  -e  MONGO_USERNAME = $MONGO_USERNAME \
                  -e  MONGO_PASSWORD = $MONGO_PASSWORD \
                  ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

              export IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
              echo $IP

              echo Testing Image URL using wget
              wget -q -O - 127.0.0.1:3000/live | grep live

          - name: Container Registry Push
            uses: docker/build-push-action@v7
            with:
              context: .
              push: true
              tags: | 
                ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{github.sha}}
                ghcr.io/${{ github.repository_owner }}/solar-system:${{github.sha}} 

  dev-deploy: 
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install kubectl CLI
        uses: azure/setup-kubectl@v4
        with:
            version: 'v1.26.0'

      - name: Set Kubeconfig
        uses: azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Fetch Kubernets Cluster Details
        run: | 
          kubectl version --short
          echo -----------------------------
          kubectl get nodes

      - name: Save Nginx Ingress Controller IP as a Github Environment variable
        run: |
          echo "INGRESS_IP=$(kubectl -n ingress-nginx get services ingress-nginx-controller -o jsonpath="{.status.loadBalancer.ingress[0].ip}")" >> $GITHUB_ENV
      
      - name: Replace Token in Manifest files
        uses: cschleiden/replace-tokens@v1
        with:
          tokenPrefix: '${'
          tokenSuffix: '}'
          files: '["kubernetes/development/*.yaml"]'
        env:
          NAMESPACE: ${{ vars.NAMESPACE }}
          REPLICAS: ${{ vars.REPLICAS }}
          IMAGE: ${{ env.DOCKERHUB_PASSWORD }}/solar-system:${{ github.sha }}
          INGRESS_IP: ${{env.INGRESS_IP}}
      
      - name: Create MongoDB secretRef
        run: |
          kubectl -n ${{ vars.NAMESPACE }} create secret generic mongo-db-creds \
          --from-literal=MONGO_URI=${{ env.MONGO_URI }} \
          --from-literal=MONGO_USERNAME=${{ env.MONGO_USERNAME }} \
          --from-literal=MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }} \
          --save-config \
          --dry-run=client \
          -o yaml | kubectl apply -f -

      - name: Deploy to Dev Environment
        run: |
          kubectl apply -f kubernetes/development

          
          
       

