name: Solar System WorkFlow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

env: 
    MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData' # esto es un placeHolder para el ejemplo
    MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
    MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
  unit-testing:
    name: Unit Testing
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Setup NodeJS Version - 18
      uses: actions/setup-node@v7
      with:
        node-version: 18

    - name: Install Dependencies
      run: npm Install

    - name: Unit Testing
      run: npm test